name: Migrated framework validation
on:
  push:
    branches: [migration-shell-20261101]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: nbari/release@5bc18d5f8e58c6be9f61078eaf3290d1d2357150
        id: validation
        with:
          adapter: tools/adapter.sh
      - env:
          RESULT: ${{ steps.validation.outputs.validation-json }}
        run: printf '%s' "${RESULT}" | jq -e '.adapter_executed==false and .project=="hello" and .runtime_revision=="5bc18d5f8e58c6be9f61078eaf3290d1d2357150"'

name: Storage consumer Action
on:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: nbari/release-flow@5d490f1ea13355b47b073fb60154d0b3255c3c2d
        id: validation
        with:
          adapter: tools/adapter.sh
      - env:
          RESULT: ${{ steps.validation.outputs.validation-json }}
        run: printf '%s' "${RESULT}" | jq -e '.adapter_executed == false and .runtime_revision == "5d490f1ea13355b47b073fb60154d0b3255c3c2d"'

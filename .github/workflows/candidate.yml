# release-flow candidate pipeline, called at a pinned commit. Copy to
# .github/workflows/candidate.yml; replace a58feb2913475458d2a0c02567fa72feeadc87e5 with the full
# commit SHA that .release-flow.json "pipeline.sha" also names.
name: Candidate

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  candidate:
    uses: nbari/release-flow/.github/workflows/candidate.yml@a58feb2913475458d2a0c02567fa72feeadc87e5
    with:
      adapter: tools/adapter.sh
    permissions:
      contents: write
      id-token: write

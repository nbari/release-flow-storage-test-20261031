# release-flow candidate pipeline, called at a pinned commit. Copy to
# .github/workflows/candidate.yml; replace 80209d086665cc7001f4fc26c50701df230896b6 with the full
# commit SHA that .release-flow.json "pipeline.sha" also names.
name: Candidate

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  candidate:
    uses: nbari/release-flow/.github/workflows/candidate.yml@80209d086665cc7001f4fc26c50701df230896b6
    with:
      adapter: tools/adapter.sh
    permissions:
      contents: write
      id-token: write

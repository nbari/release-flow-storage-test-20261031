# release-flow candidate pipeline, called at a pinned commit. Copy to
# .github/workflows/candidate.yml; replace 5d490f1ea13355b47b073fb60154d0b3255c3c2d with the full
# commit SHA that .release-flow.json "pipeline.sha" also names.
name: Candidate

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  candidate:
    uses: nbari/release-flow/.github/workflows/candidate.yml@5d490f1ea13355b47b073fb60154d0b3255c3c2d
    with:
      adapter: tools/adapter.sh
    permissions:
      contents: write
      id-token: write

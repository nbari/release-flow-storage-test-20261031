# release-flow candidate pipeline, called at a pinned commit. Copy to
# .github/workflows/candidate.yml; replace 8c7d444b9e47ae28d0864e8d9fc3c936530f5b5f with the full
# commit SHA that .release-flow.json "pipeline.sha" also names.
name: Candidate

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  candidate:
    uses: nbari/release-flow/.github/workflows/candidate.yml@8c7d444b9e47ae28d0864e8d9fc3c936530f5b5f
    with:
      adapter: tools/adapter.sh
    permissions:
      contents: write
      id-token: write

# release-flow candidate pipeline, called at a pinned commit. Copy to
# .github/workflows/candidate.yml; replace 5bc18d5f8e58c6be9f61078eaf3290d1d2357150 with the full
# commit SHA that .release-flow.json "pipeline.sha" also names.
name: Candidate

on:
  push:
    branches: ['release/**']

permissions:
  contents: read

jobs:
  candidate:
    uses: nbari/release/.github/workflows/candidate.yml@5bc18d5f8e58c6be9f61078eaf3290d1d2357150
    with:
      adapter: tools/adapter.sh
    permissions:
      contents: write
      id-token: write
